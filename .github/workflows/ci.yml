name: CI
# Runs the pipeline with the minimal test dataset to check that it completes
on:
  push:
    branches: [main]
  pull_request:

env:
  NXF_ANSI_LOG: false
  # Nextflow 25.10+ defaults to the strict syntax parser, which cannot load this pipeline yet
  NXF_SYNTAX_PARSER: v1

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Run pipeline with test data (Nextflow ${{ matrix.NXF_VER }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "24.04.4"
          - "latest-stable"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Run pipeline with test data
        run: nextflow run ${GITHUB_WORKSPACE} -profile test,docker --outdir ./results

      - name: Check outputs
        run: |
          test -s results/multiqc/multiqc_report.html
          test -s results/bbmap/SAMPLE1_T1.bam
          grep -q trimgalore results/pipeline_info/software_versions.yml
          grep -q bbmap results/pipeline_info/software_versions.yml
